<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Tela Cheia Exemplo 1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #2e353b;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      
      gap: 6px; 
      
      width: 100vw;
      height: 100vh;
      padding: 6px;
    }

    .box {
      background-color: #8faec4;
      background-size: cover;
      background-position: center;
    }

    /* Caixa 1: ocupa 1 coluna | Caixa 2: ocupa 2 colunas */
    .box-1 { grid-column: span 1; }
    .box-2 { grid-column: span 2; }

    /* Caixa 3: ocupa 2 colunas | Caixa 4: ocupa 1 coluna */
    .box-3 { grid-column: span 2; }
    .box-4 { grid-column: span 1; }

    /* Caixa 5: ocupa 1 coluna | Caixa 6: ocupa 2 colunas */
    .box-5 { grid-column: span 1; }
    .box-6 { grid-column: span 2; }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="box box-1"></div>
    <div class="box box-2"></div>
    <div class="box box-3"></div>
    <div class="box box-4"></div>
    <div class="box box-5"></div>
    <div class="box box-6"></div>
  </div>

</body>
</html>
