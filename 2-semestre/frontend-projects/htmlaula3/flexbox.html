<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            height: 100vh;
            flex-direction: column;
            justify-content: start;
            align-items: start;

        .box{

            height: 120px;
            margin: 10px;

            border: 2px solid yellow;

            color: white;
            text-align: center;
        }
    </style>
</head>

    <div class="container">
        <div class="box">1</div>
    </div>
</body>
</html>
